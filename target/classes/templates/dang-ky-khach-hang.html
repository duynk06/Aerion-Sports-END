<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký Khách hàng - Aerion Sports</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.6.7/axios.min.js"></script>
</head>
<body>

<div class="register-page">
    <div class="register-card">

        <div class="register-logo">
            <img src="/images/Logo_Da.jpg" alt="Aerion Sports" class="logo-image" />
        </div>

        <h2 class="register-title">Đăng ký tài khoản Khách hàng</h2>
        <p class="register-subtitle">Điền thông tin bên dưới, hệ thống sẽ tự tạo tài khoản và gửi mật khẩu qua email</p>

        <form id="register-form" onsubmit="return false;">
            <div class="form-group">
                <label>Họ và tên</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user input-icon"></i>
                    <input type="text" id="hoTen" placeholder="Nhập họ và tên đầy đủ" />
                </div>
            </div>

            <div class="form-group">
                <label>Số điện thoại</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-phone input-icon"></i>
                    <input type="text" id="sdt" placeholder="Nhập số điện thoại" />
                </div>
            </div>

            <div class="form-group">
                <label>Email</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-envelope input-icon"></i>
                    <input type="email" id="email" placeholder="Nhập email (dùng làm tên đăng nhập)" />
                </div>
            </div>

            <div id="error-message" class="error-message" style="display:none;"></div>
            <div id="success-message" class="success-message" style="display:none;"></div>

            <button type="submit" class="btn-register" id="registerBtn" onclick="dangKy()">
                <span id="registerBtnText">Đăng ký</span>
                <i class="fa-solid fa-spinner fa-spin" id="registerBtnSpinner" style="display:none;"></i>
            </button>
        </form>

        <div class="back-link">
            <a th:href="@{/templates/login}"><i class="fa-solid fa-arrow-left"></i> Quay lại đăng nhập</a>
        </div>

        <div class="register-footer">
            © 2026 Aerion Sports. Hệ thống quản lý cửa hàng vợt cầu lông.
        </div>
    </div>
</div>

<script>
    function showError(message) {
        hideSuccess();
        const el = document.getElementById('error-message');
        el.innerText = message;
        el.style.display = 'block';
    }

    function hideError() {
        document.getElementById('error-message').style.display = 'none';
    }

    function showSuccess(message) {
        hideError();
        const el = document.getElementById('success-message');
        el.innerText = message;
        el.style.display = 'block';
    }

    function hideSuccess() {
        document.getElementById('success-message').style.display = 'none';
    }

    function setLoading(isLoading) {
        const btn = document.getElementById('registerBtn');
        const text = document.getElementById('registerBtnText');
        const spinner = document.getElementById('registerBtnSpinner');
        btn.disabled = isLoading;
        text.style.display = isLoading ? 'none' : 'inline';
        spinner.style.display = isLoading ? 'inline-block' : 'none';
    }

    async function dangKy() {
        hideError();
        hideSuccess();

        const hoTen = document.getElementById('hoTen').value.trim();
        const sdt = document.getElementById('sdt').value.trim();
        const email = document.getElementById('email').value.trim();

        if (!hoTen || !sdt || !email) {
            showError('Vui lòng nhập đầy đủ họ tên, số điện thoại và email!');
            return;
        }

        setLoading(true);
        try {
            const res = await axios.post('/api/auth/dang-ky-khach-hang', { hoTen, sdt, email });
            showSuccess(res.data.message || 'Đăng ký thành công! Vui lòng kiểm tra email.');
            document.getElementById('register-form').reset();
        } catch (e) {
            showError(e.response?.data?.message || 'Đăng ký thất bại! Vui lòng thử lại.');
        } finally {
            setLoading(false);
        }
    }

    document.getElementById('register-form').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
            dangKy();
        }
    });
</script>

<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: linear-gradient(135deg, #fff7ed 0%, #ffe8d6 100%);
        min-height: 100vh;
    }

    .register-page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    .register-card {
        background: #ffffff;
        width: 100%;
        max-width: 420px;
        padding: 40px 36px 32px;
        border-radius: 16px;
        box-shadow: 0 10px 40px rgba(247, 155, 102, 0.18), 0 2px 8px rgba(0,0,0,0.04);
    }

    .register-logo {
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 24px;
    }

    .logo-image {
        max-width: 220px;
        height: auto;
    }

    .register-title {
        text-align: center;
        font-size: 20px;
        color: #1f2937;
        margin: 0 0 6px;
        font-weight: 700;
    }

    .register-subtitle {
        text-align: center;
        font-size: 13px;
        color: #9ca3af;
        margin: 0 0 26px;
        line-height: 1.5;
    }

    .form-group {
        margin-bottom: 18px;
    }

    .form-group label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: #374151;
        margin-bottom: 6px;
    }

    .input-wrapper {
        position: relative;
        display: flex;
        align-items: center;
    }

    .input-icon {
        position: absolute;
        left: 14px;
        color: #9ca3af;
        font-size: 14px;
    }

    .input-wrapper input {
        width: 100%;
        height: 44px;
        padding: 0 14px 0 42px;
        border: 1.5px solid #e5e7eb;
        border-radius: 8px;
        font-size: 14px;
        outline: none;
        transition: border-color .15s ease, box-shadow .15s ease;
        background: #f9fafb;
    }

    .input-wrapper input:focus {
        border-color: #f79b66;
        background: #fff;
        box-shadow: 0 0 0 3px rgba(247, 155, 102, 0.12);
    }

    .error-message {
        background: #fef2f2;
        border: 1px solid #fecaca;
        color: #dc2626;
        font-size: 13px;
        padding: 10px 14px;
        border-radius: 6px;
        margin-bottom: 18px;
    }

    .success-message {
        background: #f0fdf4;
        border: 1px solid #bbf7d0;
        color: #16a34a;
        font-size: 13px;
        padding: 10px 14px;
        border-radius: 6px;
        margin-bottom: 18px;
    }

    .btn-register {
        width: 100%;
        height: 46px;
        border: none;
        border-radius: 8px;
        background: linear-gradient(135deg, #f79b66, #f07b3f);
        color: #fff;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: opacity .15s ease, transform .1s ease;
        box-shadow: 0 4px 12px rgba(247, 155, 102, 0.3);
    }

    .btn-register:hover:not(:disabled) {
        opacity: 0.92;
    }

    .btn-register:active:not(:disabled) {
        transform: translateY(1px);
    }

    .btn-register:disabled {
        opacity: 0.7;
        cursor: not-allowed;
    }

    .back-link {
        text-align: center;
        margin-top: 18px;
        font-size: 13px;
    }

    .back-link a {
        color: #6b7280;
        text-decoration: none;
    }

    .back-link a:hover {
        color: #f79b66;
    }

    .register-footer {
        text-align: center;
        font-size: 12px;
        color: #9ca3af;
        margin-top: 20px;
    }
</style>
</body>
</html>
