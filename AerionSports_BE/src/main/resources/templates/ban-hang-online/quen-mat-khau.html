<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/ban-hang-online-layout :: ban-hang-online-layout(~{::#forgot-password-page}, ${pageTitle})}">
<head>
    <meta charset="UTF-8">
</head>
<body>
<div id="forgot-password-page">
    <link rel="stylesheet" th:href="@{/ban-hang-online/auth.css(v=3)}">

    <div class="container-wide">
        <div class="auth-breadcrumb">
            <a th:href="@{/cua-hang}">Trang chủ</a> &gt; <span>Quên mật khẩu</span>
        </div>

        <div class="auth-container">
            <div class="auth-card">
                <h1 class="auth-title">Quên mật khẩu</h1>
                <p class="auth-subtitle">Nhập địa chỉ email đã đăng ký tài khoản. Aerion Sports sẽ cấp lại mật khẩu mới và gửi trực tiếp tới email của bạn.</p>

                <div id="forgot-error" class="auth-message auth-message--error" style="display:none;"></div>
                <div id="forgot-success" class="auth-message auth-message--success" style="display:none;"></div>

                <form id="forgot-password-form">
                    <div class="auth-form-group">
                        <label for="forgot-email" class="auth-label">Địa chỉ Email</label>
                        <div class="auth-input-wrapper">
                            <i class="ph ph-envelope-simple auth-input-icon"></i>
                            <input type="email"
                                   id="forgot-email"
                                   class="auth-input auth-input--has-icon"
                                   placeholder="Ví dụ: nguyenvana@gmail.com"
                                   autocomplete="email"
                                   required>
                        </div>
                    </div>

                    <button type="submit" class="auth-btn" id="forgot-submit-btn">
                        <span id="forgot-submit-text">GỬI YÊU CẦU LẤY LẠI MẬT KHẨU</span>
                    </button>
                </form>

                <div class="auth-footer">
                    Đã nhớ mật khẩu? <a th:href="@{/cua-hang/dang-nhap}">Đăng nhập ngay</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function () {
            const form = document.getElementById("forgot-password-form");
            const emailInput = document.getElementById("forgot-email");
            const submitBtn = document.getElementById("forgot-submit-btn");
            const submitText = document.getElementById("forgot-submit-text");
            const errorBox = document.getElementById("forgot-error");
            const successBox = document.getElementById("forgot-success");

            function showMessage(box, message) {
                errorBox.style.display = "none";
                successBox.style.display = "none";
                box.innerHTML = message;
                box.style.display = "block";
            }

            form.addEventListener("submit", async function (event) {
                event.preventDefault();
                const email = emailInput.value.trim();
                if (!email) {
                    showMessage(errorBox, '<i class="ph ph-warning-circle"></i> Vui lòng nhập địa chỉ email của bạn.');
                    return;
                }

                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailRegex.test(email)) {
                    showMessage(errorBox, '<i class="ph ph-warning-circle"></i> Địa chỉ email không đúng định dạng.');
                    return;
                }

                submitBtn.disabled = true;
                submitText.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> ĐANG GỬI MẬT KHẨU...';
                errorBox.style.display = "none";
                successBox.style.display = "none";

                try {
                    const response = await fetch("/api/auth/quen-mat-khau", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ email })
                    });
                    const data = await response.json().catch(function () {
                        return {};
                    });
                    if (!response.ok) {
                        showMessage(errorBox, '<i class="ph ph-warning-circle"></i> ' + (data.message || "Có lỗi xảy ra, vui lòng thử lại sau."));
                        return;
                    }
                    showMessage(successBox, '<i class="ph ph-check-circle"></i> ' + (data.message || "Nếu email tồn tại trong hệ thống, mật khẩu mới đã được gửi tới hòm thư của bạn."));
                    form.reset();
                } catch (error) {
                    showMessage(errorBox, '<i class="ph ph-warning-circle"></i> Có lỗi xảy ra trong quá trình xử lý, vui lòng thử lại.');
                } finally {
                    submitBtn.disabled = false;
                    submitText.innerHTML = 'GỬI YÊU CẦU LẤY LẠI MẬT KHẨU';
                }
            });
        })();
    </script>
</div>
</body>
</html>
