<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập - Aerion Sports</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.6.7/axios.min.js"></script>
</head>
<body>

<div class="login-page">
    <div class="login-card">

        <!-- THAY BẰNG: dùng ảnh logo thật -->
        <div class="login-logo">
            <img src="/images/Logo_Da.jpg" alt="Aerion Sports" class="logo-image" />
        </div>

        <h2 class="login-title">Đăng nhập hệ thống</h2>
        <p class="login-subtitle">Quản trị viên vui lòng đăng nhập để tiếp tục</p>

        <form id="login-form" onsubmit="return false;">
            <div class="form-group">
                <label>Tên đăng nhập</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user input-icon"></i>
                    <input type="text" id="tenDangNhap" placeholder="Nhập tên đăng nhập" autocomplete="username" />
                </div>
            </div>

            <div class="form-group">
                <label>Mật khẩu</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input type="password" id="matKhau" placeholder="Nhập mật khẩu" autocomplete="current-password" />
                    <i class="fa-solid fa-eye toggle-password-icon" id="togglePasswordIcon" onclick="togglePassword()"></i>
                </div>
            </div>

            <div id="error-message" class="error-message" style="display:none;"></div>

            <button type="submit" class="btn-login" id="loginBtn" onclick="login()">
                <span id="loginBtnText">Đăng nhập</span>
                <i class="fa-solid fa-spinner fa-spin" id="loginBtnSpinner" style="display:none;"></i>
            </button>
        </form>

        <div class="login-footer">
            © 2026 Aerion Sports. Hệ thống quản lý cửa hàng vợt cầu lông.
        </div>
    </div>
</div>

<script>
    let isPasswordVisible = false;

    function togglePassword() {
        const input = document.getElementById('matKhau');
        const icon = document.getElementById('togglePasswordIcon');
        isPasswordVisible = !isPasswordVisible;

        input.type = isPasswordVisible ? 'text' : 'password';
        icon.classList.toggle('fa-eye');
        icon.classList.toggle('fa-eye-slash');
    }

    function showError(message) {
        const errorEl = document.getElementById('error-message');
        errorEl.innerText = message;
        errorEl.style.display = 'block';
    }

    function hideError() {
        document.getElementById('error-message').style.display = 'none';
    }

    function setLoading(isLoading) {
        const btn = document.getElementById('loginBtn');
        const text = document.getElementById('loginBtnText');
        const spinner = document.getElementById('loginBtnSpinner');
        btn.disabled = isLoading;
        text.style.display = isLoading ? 'none' : 'inline';
        spinner.style.display = isLoading ? 'inline-block' : 'none';
    }

    async function login() {
        hideError();

        const tenDangNhap = document.getElementById('tenDangNhap').value.trim();
        const matKhau = document.getElementById('matKhau').value;

        if (!tenDangNhap || !matKhau) {
            showError('Vui lòng nhập đầy đủ tên đăng nhập và mật khẩu!');
            return;
        }

        setLoading(true);
        try {
            const res = await axios.post('/api/auth/login', { tenDangNhap, matKhau });

            sessionStorage.setItem('token', res.data.token);
            sessionStorage.setItem('user', JSON.stringify(res.data.user));
            document.cookie = `jwt_token=${res.data.token}; path=/; max-age=86400; SameSite=Lax`;

            // 🌟 Điều hướng theo vai trò
            const vaiTro = res.data.user.ma_vai_tro;
            if (vaiTro === 'ADMIN') {
                location.href = '/thong-ke';
            } else if (vaiTro === 'QL') {
                location.href = '/thong-ke';
            } else {
                location.href = '/ban-hang'; // NV vào thẳng màn bán hàng
            }

        } catch (e) {
            showError(e.response?.data?.message || 'Đăng nhập thất bại! Vui lòng thử lại.');
            setLoading(false);
        }
    }

    // Cho phép nhấn Enter để đăng nhập
    document.getElementById('login-form').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
            login();
        }
    });
</script>

<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: linear-gradient(135deg, #fff7ed 0%, #ffe8d6 100%);
        min-height: 100vh;
    }

    .login-page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    .login-card {
        background: #ffffff;
        width: 100%;
        max-width: 400px;
        padding: 40px 36px 32px;
        border-radius: 16px;
        box-shadow: 0 10px 40px rgba(247, 155, 102, 0.18), 0 2px 8px rgba(0,0,0,0.04);
    }
    .login-logo {
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 28px;
    }
    .logo-image {
        max-width: 240px;
        height: auto;
    }

    .logo-text {
        display: flex;
        flex-direction: column;
        line-height: 1.1;
    }

    .logo-title {
        font-size: 20px;
        font-weight: 800;
        color: #1a2942;
        letter-spacing: 0.5px;
    }

    .logo-subtitle {
        font-size: 12px;
        font-weight: 600;
        color: #f79b66;
        letter-spacing: 2px;
    }

    .login-title {
        text-align: center;
        font-size: 20px;
        color: #1f2937;
        margin: 0 0 6px;
        font-weight: 700;
    }

    .login-subtitle {
        text-align: center;
        font-size: 13px;
        color: #9ca3af;
        margin: 0 0 28px;
    }

    .form-group {
        margin-bottom: 18px;
    }

    .form-group label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: #374151;
        margin-bottom: 6px;
    }

    .input-wrapper {
        position: relative;
        display: flex;
        align-items: center;
    }

    .input-icon {
        position: absolute;
        left: 14px;
        color: #9ca3af;
        font-size: 14px;
    }

    .input-wrapper input {
        width: 100%;
        height: 44px;
        padding: 0 42px;
        border: 1.5px solid #e5e7eb;
        border-radius: 8px;
        font-size: 14px;
        outline: none;
        transition: border-color .15s ease, box-shadow .15s ease;
        background: #f9fafb;
    }

    .input-wrapper input:focus {
        border-color: #f79b66;
        background: #fff;
        box-shadow: 0 0 0 3px rgba(247, 155, 102, 0.12);
    }

    .toggle-password-icon {
        position: absolute;
        right: 14px;
        color: #9ca3af;
        font-size: 14px;
        cursor: pointer;
        transition: color .15s ease;
    }

    .toggle-password-icon:hover {
        color: #f79b66;
    }

    .error-message {
        background: #fef2f2;
        border: 1px solid #fecaca;
        color: #dc2626;
        font-size: 13px;
        padding: 10px 14px;
        border-radius: 6px;
        margin-bottom: 18px;
    }

    .btn-login {
        width: 100%;
        height: 46px;
        border: none;
        border-radius: 8px;
        background: linear-gradient(135deg, #f79b66, #f07b3f);
        color: #fff;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: opacity .15s ease, transform .1s ease;
        box-shadow: 0 4px 12px rgba(247, 155, 102, 0.3);
    }

    .btn-login:hover:not(:disabled) {
        opacity: 0.92;
    }

    .btn-login:active:not(:disabled) {
        transform: translateY(1px);
    }

    .btn-login:disabled {
        opacity: 0.7;
        cursor: not-allowed;
    }

    .login-footer {
        text-align: center;
        font-size: 12px;
        color: #9ca3af;
        margin-top: 26px;
    }
</style>
</body>
</html>
