<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:fragment="main-layout(dynamicContent)">
<head>
  <meta charset="UTF-8">
  <title>Aerion Sports - Quản trị</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      margin: 0;
      background-color: #f3f4f6;
      font-family: Arial, sans-serif;
    }
  </style>
</head>
<body>
<div class="main-layout-shell">
  <div class="main-layout-sidebar" th:replace="~{fragments/sidebar :: menu-sidebar}"></div>

  <div class="main-layout-content-shell">
    <div class="main-layout-header">
      <h2 class="main-layout-title">Quản lý hệ thống</h2>

      <div class="main-layout-user">
        <div class="main-layout-avatar">
          <i class="fa-solid fa-user"></i>
        </div>
        <div class="main-layout-user-text">
          <div class="main-layout-user-name">Admin</div>
          <div class="main-layout-user-role">Quản trị viên</div>
        </div>
      </div>
    </div>

    <div class="main-layout-content">
      <div th:replace="${dynamicContent}"></div>
    </div>
  </div>
</div>

<style>
  .main-layout-shell {
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  .main-layout-sidebar {
    flex: 0 0 250px;
    width: 250px;
    min-width: 250px;
    max-width: 250px;
  }

  .main-layout-content-shell {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }

  .main-layout-header {
    height: 65px;
    background: #fff;
    padding: 0 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #e5e7eb;
    flex: 0 0 auto;
  }

  .main-layout-title {
    margin: 0;
    font-size: 20px;
    color: #1f2937;
  }

  .main-layout-user {
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    flex: 0 0 auto;
  }

  .main-layout-avatar {
    width: 36px;
    height: 36px;
    background: #f79b66;
    border-radius: 50%;
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
  }

  .main-layout-user-text {
    line-height: 1.2;
  }

  .main-layout-user-name {
    font-weight: 600;
    font-size: 14px;
    color: #111827;
  }

  .main-layout-user-role {
    font-size: 12px;
    color: #6b7280;
  }

  .main-layout-content {
    flex: 1 1 auto;
    min-width: 0;
    padding: 24px;
    overflow: auto;
  }
</style>
</body>
</html>
