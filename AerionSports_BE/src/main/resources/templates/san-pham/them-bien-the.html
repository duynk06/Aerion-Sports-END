<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: main-layout(~{::content})}">
<head>
</head>
<body>

<div th:fragment="content">
    <link class="stat-style" rel="stylesheet" th:href="@{/san-pham/san-pham.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        .variant-card { background: #fff; padding: 25px; border-radius: 12px; border: 1px solid #edf2f7; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 25px; }
        .variant-header-title { font-size: 15px; font-weight: 700; color: #f79b66; border-left: 4px solid #f79b66; padding-left: 12px; margin-bottom: 20px; text-align: left; text-transform: uppercase; }

        .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .form-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 20px; }

        .form-group { display: flex; flex-direction: column; gap: 8px; text-align: left; }
        .form-group label { font-size: 13px; font-weight: 600; color: #4a5568; }
        .form-group label .required { color: #ef4444; }

        .form-group input, .form-group select { padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13.5px; outline: none; font-family: Arial, sans-serif; height: 40px; box-sizing: border-box; transition: all 0.2s; }
        .form-group input:focus, .form-group select:focus { border-color: #f79b66; box-shadow: 0 0 0 3px rgba(247, 155, 102, 0.15); }

        /* CSS cho các ô bị khóa cố định thông số nền */
        .form-group input:disabled, .form-group select:disabled { background-color: #f8fafc; color: #64748b; border-color: #e2e8f0; cursor: not-allowed; font-weight: 500; }

        .currency-wrapper { position: relative; display: flex; align-items: center; }
        .currency-wrapper input { width: 100%; padding-right: 50px !important; }
        .currency-suffix { position: absolute; right: 14px; font-size: 12px; font-weight: 700; color: #94a3b8; user-select: none; }

        .parent-info-box { background: #fff7ed; border: 1px solid #ffedd5; border-radius: 8px; padding: 15px 20px; margin-bottom: 25px; display: flex; align-items: center; gap: 15px; }
        .parent-info-box i { color: #ea580c; font-size: 18px; }
        .parent-info-text { font-size: 13.5px; color: #c2410c; font-weight: 500; }
    </style>

    <div class="breadcrumb-container">
        <span class="breadcrumb-text">Quản lý sản phẩm / <strong style="color: #f97316;">Thêm biến thể mới</strong></span>
        <a class="btn-filter-clear" th:href="@{/san-pham/bien-the(idSP=${idSP}, maSP=${maSP}, tenSP=${tenSP})}" style="text-decoration: none; line-height: 38px;">Quay lại chi tiết</a>
    </div>

    <div class="parent-info-box">
        <i class="fa-solid fa-circle-info"></i>
        <div class="parent-info-text">
            Bạn đang bổ sung biến thể mới cho dòng sản phẩm:
            <strong th:text="'[' + ${maSP} + '] - ' + ${tenSP}">[SP001] - Vợt Cầu Lông</strong>
        </div>
    </div>

    <form id="formAddVariant" th:action="@{/san-pham/bien-the/luu}" method="post" enctype="multipart/form-data" onsubmit="return validateAndSubmitForm(event)">
        <input type="hidden" name="idSP" th:value="${idSP}">
        <input type="hidden" name="maSP" th:value="${maSP}">
        <input type="hidden" name="tenSP" th:value="${tenSP}">

        <input type="hidden" name="maCtsp" th:value="${maSkuTuSinh}">

        <div class="variant-card" style="background-color: #fcfcfc;">
            <div class="variant-header-title" style="color: #64748b; border-left-color: #cbd5e1;"><i class="fa-solid fa-lock"></i> 1. Thông số kỹ thuật chung (Cố định)</div>

            <div class="form-grid-3">
                <div class="form-group">
                    <label>Mã sản phẩm</label>
                    <input type="text" th:value="${maSP}" disabled>
                </div>
                <div class="form-group">
                    <label>Tên sản phẩm</label>
                    <input type="text" th:value="${tenSP}" disabled>
                </div>
                <div class="form-group">
                    <label>Danh mục sản phẩm</label>
                    <input type="text" th:value="${productInfo?.tenDanhMuc}" placeholder="--" disabled>
                </div>
            </div>

            <div class="form-grid-3">
                <div class="form-group">
                    <label>Thương hiệu</label>
                    <input type="text" th:value="${productInfo?.tenThuongHieu}" placeholder="--" disabled>
                </div>
                <div class="form-group">
                    <label>Xuất xứ</label>
                    <input type="text" th:value="${productInfo?.tenXuatXu}" placeholder="--" disabled>
                </div>
                <div class="form-group">
                    <label>Độ cứng thân vợt</label>
                    <input type="text" th:value="${productInfo?.tenDoCung}" placeholder="--" disabled>
                </div>
            </div>

            <div class="form-grid-3">
                <div class="form-group">
                    <label>Điểm cân bằng</label>
                    <input type="text" th:value="${productInfo?.tenDiemCanBang}" placeholder="--" disabled>
                </div>
                <div class="form-group">
                    <label>Chu vi cán vợt</label>
                    <input type="text" th:value="${productInfo?.tenChuViCanVot}" placeholder="--" disabled>
                </div>
                <div class="form-group">
                    <label>Chất liệu thân vợt</label>
                    <input type="text" th:value="${productInfo?.tenChatLieuThanVot}" placeholder="--" disabled>
                </div>
            </div>

            <div class="form-grid-2">
                <div class="form-group">
                    <label>Chất liệu khung vợt</label>
                    <input type="text" th:value="${productInfo?.tenChatLieuKhungVot}" placeholder="--" disabled>
                </div>
            </div>
        </div>

        <div class="variant-card">
            <div class="variant-header-title"><i class="fa-solid fa-square-plus"></i> 2. Thông tin thuộc tính & Giá thương mại</div>

            <div class="form-grid-2">
                <div class="form-group">
                    <label>Màu sắc kinh doanh <span class="required">*</span></label>
                    <select id="idMauSac" name="idMauSac" required>
                        <option value="">-- Chọn màu sắc biến thể --</option>
                        <option th:each="m : ${danhSachMauSac}" th:value="${m.id}" th:text="${m.tenMauSac}"></option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Trọng lượng kinh doanh (U) <span class="required">*</span></label>
                    <select id="idTrongLuong" name="idTrongLuong" required>
                        <option value="">-- Chọn trọng lượng --</option>
                        <option th:each="t : ${danhSachTrongLuong}" th:value="${t.id}" th:text="${t.tenTrongLuong}"></option>
                    </select>
                </div>
            </div>

            <div class="form-grid-3">
                <div class="form-group">
                    <label>Số lượng tồn kho ban đầu <span class="required">*</span></label>
                    <input type="number" id="soLuong" name="soLuong" value="10" min="0" step="1" placeholder="Nhập số lượng..." required>
                </div>
                <div class="form-group">
                    <label>Giá nhập kho <span class="required">*</span></label>
                    <div class="currency-wrapper">
                        <input type="text" inputmode="numeric" id="giaNhapHienThi" placeholder="0" oninput="dinhDangSoTien(this)" required>
                        <input type="hidden" id="giaNhap" name="giaNhap">
                        <span class="currency-suffix">đ</span>
                    </div>
                </div>
                <div class="form-group">
                    <label>Giá bán lẻ <span class="required">*</span></label>
                    <div class="currency-wrapper">
                        <input type="text" inputmode="numeric" id="giaBanHienThi" placeholder="0" oninput="dinhDangSoTien(this)" required>
                        <input type="hidden" id="giaBan" name="giaBan">
                        <span class="currency-suffix">đ</span>
                    </div>
                </div>
            </div>

            <div class="form-grid-2">
                <div class="form-group">
                    <label>Hình ảnh hiển thị biến thể (Tùy chọn)</label>
                    <input type="file" name="fileAnh" accept="image/*" style="padding: 7px 14px; width: 100%;">
                </div>
            </div>
        </div>

        <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 25px; margin-bottom: 40px;">
            <a th:href="@{/san-pham/bien-the(idSP=${idSP}, maSP=${maSP}, tenSP=${tenSP})}" class="btn-filter-clear" style="line-height:38px; text-decoration: none;">Hủy bỏ</a>
            <button type="submit" class="btn-action-solid" style="height: 38px; padding: 0 35px;">Xác nhận thêm biến thể</button>
        </div>
    </form>

    <script th:inline="javascript">
        /*<![CDATA[*/
        const thongBaoLoi = /*[[${param.error}]]*/ null;
        /*]]>*/
        if (thongBaoLoi) {
            alert('Lỗi khi thêm biến thể:\n\n' + thongBaoLoi);
        }
        function dinhDangSoTien(input) {
            let chiSo = input.value.replace(/\D/g, '');
            if (chiSo === '') {
                input.value = '';
                return;
            }
            chiSo = chiSo.replace(/^0+(?=\d)/, '');
            input.value = new Intl.NumberFormat('vi-VN').format(Number(chiSo));
        }

        function layGiaTriSoTuChuoi(chuoi) {
            if (!chuoi) return 0;
            return Number(String(chuoi).replace(/\./g, '')) || 0;
        }

        function validateAndSubmitForm(event) {
            event.preventDefault();

            const idMau = document.getElementById('idMauSac').value;
            const idTrong = document.getElementById('idTrongLuong').value;
            const slText = document.getElementById('soLuong').value;
            const sl = parseInt(slText) || 0;

            const giaNhapThuc = layGiaTriSoTuChuoi(document.getElementById('giaNhapHienThi').value);
            const giaBanThuc = layGiaTriSoTuChuoi(document.getElementById('giaBanHienThi').value);

            if (!idMau || !idTrong) {
                alert('Lỗi: Vui lòng lựa chọn đầy đủ thông tin Màu sắc và Trọng lượng cho biến thể!');
                return false;
            }

            if (slText === "" || sl < 0 || !Number.isInteger(parseFloat(slText))) {
                alert('Lỗi: Số lượng tồn kho khởi tạo phải là số nguyên lớn hơn hoặc bằng 0!');
                document.getElementById('soLuong').focus();
                return false;
            }

            if (giaNhapThuc <= 0 || giaBanThuc <= 0) {
                alert('Lỗi: Giá nhập kho và Giá bán thương mại bắt buộc phải lớn hơn 0 đ!');
                return false;
            }

            if (giaBanThuc < giaNhapThuc) {
                alert('Lỗi thiết lập nghiệp vụ: Giá bán lẻ thương mại không được phép nhỏ hơn Giá vốn nhập kho!');
                document.getElementById('giaBanHienThi').focus();
                return false;
            }

            if (confirm('Hệ thống Aerion Sports xác nhận:\n\nBạn có chắc chắn muốn khởi tạo cấu hình biến thể mới này không?')) {
                document.getElementById('giaNhap').value = giaNhapThuc;
                document.getElementById('giaBan').value = giaBanThuc;
                document.getElementById('formAddVariant').submit();
                return true;
            }
            return false;
        }
    </script>
</div>
</body>
</html>
