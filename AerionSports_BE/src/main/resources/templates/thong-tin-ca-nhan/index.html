<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: main-layout(~{::#thong-tin-ca-nhan-view})}">
<head>
    <meta charset="UTF-8">
    <title>Thông tin cá nhân</title>
</head>
<body>

<div id="thong-tin-ca-nhan-view">

    <style>
        .back-header{margin-bottom:16px;}
        .btn-back-link{background:none;border:none;color:#94a3b8;cursor:pointer;font-size:14px;padding:0;}
        .btn-back-link:hover{color:#f79b66;}

        .card{background:#fff;border-radius:12px;padding:32px;margin-bottom:20px;border:1px solid #e5e7eb;max-width:1100px;}
        .card-header{background:#f79b66;color:#fff;padding:14px 20px;border-radius:8px;margin-bottom:28px;font-weight:600;font-size:15px;}
        .form-row{display:grid;grid-template-columns:repeat(3, 1fr);gap:24px;margin-bottom:20px;}
        .form-group label{display:block;margin-bottom:6px;font-size:13px;font-weight:500;color:#374151;}
        .form-group input{
            width:100%;height:42px;border:1px solid #d1d5db;border-radius:6px;
            padding:0 14px;box-sizing:border-box;background:#f3f4f6;color:#374151;
            font-family:inherit;font-size:14px;
        }
    </style>

    <div class="back-header">
        <button type="button" class="btn-back-link" onclick="history.back()">
            <i class="fa-solid fa-arrow-left"></i> Quay lại
        </button>
    </div>

    <div class="card">
        <div class="card-header">
            <i class="fa-solid fa-user"></i> Thông tin cá nhân
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Mã nhân viên</label>
                <input type="text" th:value="${nhanVien.maNv}" disabled>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="text" th:value="${nhanVien.email}" disabled>
            </div>
            <div class="form-group">
                <label>Số điện thoại</label>
                <input type="text" th:value="${nhanVien.sdt}" disabled>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Họ và tên</label>
                <input type="text" th:value="${nhanVien.tenNv}" disabled>
            </div>
            <div class="form-group">
                <label>Giới tính</label>
                <input type="text"
                       th:value="${nhanVien.gioiTinh != null and nhanVien.gioiTinh == 1 ? 'Nam' : (nhanVien.gioiTinh != null and nhanVien.gioiTinh == 0 ? 'Nữ' : 'Chưa cập nhật')}"
                       disabled>
            </div>
            <div class="form-group"></div>
        </div>

        <div class="form-group">
            <label>Địa chỉ</label>
            <input type="text" th:value="${nhanVien.diaChi != null and !nhanVien.diaChi.isEmpty() ? nhanVien.diaChi : 'Chưa cập nhật'}" disabled>
        </div>

        <script>
            document.addEventListener('DOMContentLoaded', function () {
                const titleEl = document.querySelector('.main-layout-title');
                if (titleEl) {
                    titleEl.textContent = 'Quản lý hệ thống / Thông tin cá nhân';
                }
            });
        </script>
    </div>

</div>

</body>

</html>
