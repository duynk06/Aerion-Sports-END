<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cập nhật nhân viên</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/alpinejs/3.13.5/cdn.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.6.7/axios.min.js"></script>
</head>
<body>

<!--
  Route: GET /nhan-vien/sua/{id}. ID nhân viên được đọc từ URL (window.location.pathname).
-->
<div th:replace="~{fragments/layout :: main-layout(~{::#content})}">
    <div id="content" x-data="suaNhanVienPage()" x-init="init()">

        <div class="customer-form-container">
            <div class="back-header">
                <button type="button" class="btn-back-link" onclick="location.href='/nhan-vien'">← Quay lại danh sách</button>
                <h3 class="page-form-title">Cập nhật thông tin nhân viên</h3>
            </div>

            <template x-if="loaded">
                <form @submit.prevent="handleSubmitForm()">
                    <div class="form-section-card edit-form-card profile-grid">
                        <div class="avatar-upload-block">
                            <div class="section-sub-title fw-bold mb-3">Ảnh đại diện</div>
                            <div class="avatar-preview-circle mb-3">
                                <img x-show="nhanVienForm.avatarPreview" :src="nhanVienForm.avatarPreview" alt="Avatar" />
                                <span x-show="!nhanVienForm.avatarPreview" class="default-avatar-icon">👤</span>
                            </div>
                            <button type="button" class="btn-upload-avatar mb-2" @click="$refs.formFileInput.click()">📁 Chọn ảnh</button>
                            <input type="file" x-ref="formFileInput" style="display:none;" accept="image/jpeg,image/png,image/jpg" @change="handleFormAvatarChange($event)" />
                            <small class="upload-hint">JPG, PNG (tối đa 2MB)</small>
                        </div>

                        <div class="info-fields-block">
                            <div class="section-sub-title fw-bold mb-3">Thông tin nhân viên</div>
                            <div class="form-row">
                                <div class="form-cell">
                                    <label>Họ và tên nhân viên <span class="required">*</span></label>
                                    <input type="text" x-model="nhanVienForm.hoTen" placeholder="Nhập họ và tên nhân viên" required />
                                </div>
                                <div class="form-cell">
                                    <label>Số điện thoại <span class="required">*</span></label>
                                    <input type="text" x-model="nhanVienForm.sdt" placeholder="Nhập số điện thoại" required />
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-cell">
                                    <label>Email <span class="required">*</span></label>
                                    <input type="email" x-model="nhanVienForm.email" placeholder="Nhập email nhân viên" required />
                                </div>
                                <div class="form-cell">
                                    <label>Ngày sinh</label>
                                    <input type="date" x-model="nhanVienForm.ngaySinh" />
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-cell">
                                    <label>Giới tính</label>
                                    <div class="radio-flex border-box">
                                        <label><input type="radio" x-model="nhanVienForm.gioiTinh" value="1" /> Nam</label>
                                        <label><input type="radio" x-model="nhanVienForm.gioiTinh" value="0" /> Nữ</label>
                                    </div>
                                </div>
                                <div class="form-cell">
                                    <label>Trạng thái</label>
                                    <select x-model.number="nhanVienForm.trangThai" class="select-box">
                                        <option :value="1">Đang làm việc</option>
                                        <option :value="0">Đã nghỉ việc</option>
                                    </select>
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-cell">
                                    <label>Vai trò hệ thống</label>
                                    <select x-model.number="nhanVienForm.vaiTro" class="select-box">
                                        <option :value="2">Quản lý</option>
                                        <option :value="3">Nhân viên</option>
                                    </select>
                                </div>
                                <div class="form-cell"></div>
                            </div>
                        </div>
                    </div>

                    <div class="form-section-card">
                        <div class="address-section-header">
                            <div class="section-sub-title fw-bold">Địa chỉ thường trú (Nơi ở hiện tại)</div>
                        </div>
                        <div class="address-item-card">
                            <div class="form-row">
                                <div class="form-cell">
                                    <label>Tỉnh / Thành phố <span class="required">*</span></label>
                                    <select x-model="diaChi.tinhThanh" class="select-box" @change="handleThayDoiTinhThanh()" required>
                                        <option value="">-- Chọn Tỉnh / Thành phố --</option>
                                        <template x-for="tinh in listTinhThanhAPI" :key="tinh.code">
                                            <option :value="tinh.name" x-text="tinh.name"></option>
                                        </template>
                                    </select>
                                </div>
                                <div class="form-cell">
                                    <label>Quận / Huyện <span class="required">*</span></label>
                                    <select x-model="diaChi.quanHuyen" class="select-box" :disabled="!diaChi.tinhThanh" @change="handleThayDoiQuanHuyen()" required>
                                        <option value="">-- Chọn Quận / Huyện --</option>
                                        <template x-for="quan in listQuanHuyenTmp" :key="quan.code">
                                            <option :value="quan.name" x-text="quan.name"></option>
                                        </template>
                                    </select>
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-cell">
                                    <label>Phường / Xã / Thị trấn <span class="required">*</span></label>
                                    <select x-model="diaChi.phuongXa" class="select-box" :disabled="!diaChi.quanHuyen" required>
                                        <option value="">-- Chọn Phường / Xã --</option>
                                        <template x-for="xa in listPhuongXaTmp" :key="xa.code">
                                            <option :value="xa.name" x-text="xa.name"></option>
                                        </template>
                                    </select>
                                </div>
                                <div class="form-cell">
                                    <label>Địa chỉ cụ thể (Số nhà, tên đường...) <span class="required">*</span></label>
                                    <input type="text" x-model="diaChi.chiTietCuThe" placeholder="Ví dụ: Số 15, ngõ 3, đường Nguyễn Trãi" required />
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="form-submit-bar">
                        <button type="button" class="btn-cancel-action" onclick="location.href='/nhan-vien'">Hủy bỏ</button>
                        <button type="submit" class="btn-submit-action">Lưu thông tin nhân viên</button>
                    </div>
                </form>
            </template>

            <div x-show="!loaded" style="padding:40px;text-align:center;color:#909399;">Đang tải dữ liệu nhân viên...</div>
        </div>

    </div>
</div>

<script>
    function suaNhanVienPage() {
        return {
            nhanVienId: null,
            loaded: false,
            listTinhThanhAPI: [],
            listQuanHuyenTmp: [],
            listPhuongXaTmp: [],

            // 🌟 avatarFile giữ File gốc để upload thật; avatarPreview chỉ để hiển thị
            nhanVienForm: { id: null, hoTen: '', sdt: '', email: '', ngaySinh: '', gioiTinh: '1', trangThai: 1, vaiTro: 3, avatarUrlCu: '', avatarPreview: '' },
            diaChiGoc: '',
            diaChi: { tinhThanh: '', quanHuyen: '', phuongXa: '', chiTietCuThe: '' },
            avatarFile: null,

            async init() {
                if (this._initialized) return;
                this._initialized = true;
                const parts = window.location.pathname.split('/').filter(Boolean);
                this.nhanVienId = parts[parts.length - 1];
                await this.load63TinhThanh();
                await this.loadDuLieuNhanVienCu();
            },

            async load63TinhThanh() {
                try {
                    const res = await axios.get('https://provinces.open-api.vn/api/p/');
                    this.listTinhThanhAPI = res.data || [];
                    console.log("Đã load", this.listTinhThanhAPI.length, "tỉnh/thành");
                } catch (e) {
                    console.error('Lỗi tải danh sách tỉnh:', e);
                }
            },

            async loadDuLieuNhanVienCu() {
                try {
                    const res = await axios.get('http://localhost:8080/nhan-vien/' + this.nhanVienId);
                    const nv = res.data;
                    console.log("Dữ liệu nhân viên từ DB:", nv);

                    // === Gán thông tin cơ bản ===
                    this.nhanVienForm = {
                        id: nv.id,
                        hoTen: nv.tenNv || '',
                        sdt: nv.sdt || '',
                        email: nv.email || '',
                        ngaySinh: nv.ngaySinh ? nv.ngaySinh.split('T')[0] : '',
                        gioiTinh: String(nv.gioiTinh || 0),
                        trangThai: nv.trangThai === 1 ? 1 : 0,
                        vaiTro: nv.vaiTro?.id || 3,
                        avatarUrlCu: nv.avatar || '',
                        avatarPreview: nv.avatar || ''
                    };

                    // === Gán địa chỉ ===
                    this.diaChi.tinhThanh = (nv.tinhThanh || '').trim();
                    this.diaChi.quanHuyen = (nv.quanHuyen || '').trim();
                    this.diaChi.phuongXa = (nv.phuongXa || '').trim();
                    this.diaChi.chiTietCuThe = nv.diaChiChiTiet || '';

                    this.loaded = true;

                    // Fill cascade sau khi loaded = true và DOM render
                    await this.$nextTick();
                    if (this.diaChi.tinhThanh) {
                        await this.fillCascadeDiaChi();
                    }

                } catch (e) {
                    console.error(e);
                    this.loaded = true;
                }
            },
            async fillCascadeDiaChi() {
                await this.handleThayDoiTinhThanh(true);
                await this.$nextTick();

                // 🌟 Ép Alpine "chọn lại" tỉnh sau khi options đã render xong
                if (this.diaChi.tinhThanh) {
                    const tinhVal = this.diaChi.tinhThanh;
                    this.diaChi.tinhThanh = '';
                    await this.$nextTick();
                    this.diaChi.tinhThanh = tinhVal;
                }

                if (this.diaChi.quanHuyen) {
                    await this.handleThayDoiQuanHuyen(true);
                }
            },

            async handleThayDoiTinhThanh(isInitial = false) {
                this.listQuanHuyenTmp = [];
                this.listPhuongXaTmp = [];
                if (!this.diaChi.tinhThanh) return;

                const tinh = this.listTinhThanhAPI.find(t =>
                    t.name.trim().toLowerCase() === this.diaChi.tinhThanh.trim().toLowerCase()
                );

                if (tinh) {
                    const res = await axios.get(`https://provinces.open-api.vn/api/p/${tinh.code}?depth=2`);
                    this.listQuanHuyenTmp = res.data.districts || [];

                    // 🌟 Ép reactivity cho quận/huyện sau khi options mới render
                    if (isInitial && this.diaChi.quanHuyen) {
                        await this.$nextTick();
                        const qhVal = this.diaChi.quanHuyen;
                        this.diaChi.quanHuyen = '';
                        await this.$nextTick();
                        this.diaChi.quanHuyen = qhVal;
                        await this.handleThayDoiQuanHuyen(true);
                    }
                }
            },

            async handleThayDoiQuanHuyen(isInitial = false) {
                this.listPhuongXaTmp = [];
                if (!this.diaChi.quanHuyen) return;

                const quan = this.listQuanHuyenTmp.find(q =>
                    q.name.trim().toLowerCase() === this.diaChi.quanHuyen.trim().toLowerCase()
                );

                if (quan) {
                    const res = await axios.get(`https://provinces.open-api.vn/api/d/${quan.code}?depth=2`);
                    this.listPhuongXaTmp = res.data.wards || [];

                    if (isInitial && this.diaChi.phuongXa) {
                        await this.$nextTick();
                        const pxVal = this.diaChi.phuongXa;
                        this.diaChi.phuongXa = '';
                        await this.$nextTick();
                        this.diaChi.phuongXa = pxVal;
                    }
                }
            },

            // 🌟 Giữ File gốc để upload, base64 chỉ dùng để preview trên form
            handleFormAvatarChange(e) {
                const f = e.target.files[0]; if (!f) return;
                if (f.size > 2 * 1024 * 1024) return alert('Dung lượng ảnh tối đa 2MB!');
                this.avatarFile = f;
                const r = new FileReader();
                r.onload = (ev) => this.nhanVienForm.avatarPreview = ev.target.result;
                r.readAsDataURL(f);
            },

            async handleSubmitForm() {
                const name = this.nhanVienForm.hoTen.trim();
                if (name.length < 3 || name.length > 100 || !/^[\p{L}\s]+$/u.test(name)) {
                    return alert('Họ tên không hợp lệ (3-100 ký tự, không chứa số/ký tự đặc biệt)!');
                }
                if (!/^(0[3|5|7|8|9])([0-9]{8})$/.test(this.nhanVienForm.sdt.trim())) {
                    return alert('Số điện thoại không đúng định dạng nhà mạng VN!');
                }
                if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(this.nhanVienForm.email.trim())) {
                    return alert('Email sai định dạng!');
                }

                const d = this.diaChi;
                let diaChiMoi;
                if (d.tinhThanh && d.quanHuyen && d.phuongXa && d.chiTietCuThe.trim()) {
                    diaChiMoi = `${d.chiTietCuThe.trim()}, ${d.phuongXa}, ${d.quanHuyen}, ${d.tinhThanh}`;
                } else {
                    diaChiMoi = this.diaChiGoc || d.chiTietCuThe.trim() || '';
                }

                try {
                    const isDuplicate = (await axios.get('http://localhost:8080/nhan-vien/check-duplicate-update', {
                        params: { sdt: this.nhanVienForm.sdt.trim(), email: this.nhanVienForm.email.trim(), id: this.nhanVienForm.id }
                    })).data;
                    if (isDuplicate) return alert('⚠️ Cảnh báo: SĐT hoặc Email đã được sử dụng bởi nhân viên khác!');

                    const xacNhan = confirm(`Bạn có chắc chắn muốn lưu thay đổi thông tin nhân viên "${name}" không?`);
                    if (!xacNhan) return;

                    // 🌟 KHÔNG gửi avatar base64 trong payload. Nếu không đổi ảnh, để trống
                    // để backend tự giữ nguyên avatar cũ (chỉ set khi có file mới).
                    const payload = {
                        tenNv: name,
                        sdt: this.nhanVienForm.sdt.trim(),
                        email: this.nhanVienForm.email.trim(),
                        ngaySinh: this.nhanVienForm.ngaySinh || null,
                        gioiTinh: Number(this.nhanVienForm.gioiTinh),
                        trangThai: Number(this.nhanVienForm.trangThai),
                        diaChi: diaChiMoi, // Chuỗi gộp nếu bạn vẫn cần lưu
                        tinhThanh: d.tinhThanh, // Gửi trực tiếp
                        quanHuyen: d.quanHuyen, // Gửi trực tiếp
                        phuongXa: d.phuongXa,   // Gửi trực tiếp
                        diaChiChiTiet: d.chiTietCuThe.trim(), // Gửi trực tiếp
                        vaiTro: { id: Number(this.nhanVienForm.vaiTro) }
                    };

                    // 🌟 Gửi multipart để khớp với endpoint updateMultipart mới thêm trong
                    // NhanVienController — avatar là file thật, không phải base64.
                    console.log("Địa chỉ:", diaChiMoi);
                    const formData = new FormData();
                    formData.append('data', JSON.stringify(payload));
                    if (this.avatarFile) formData.append('avatar', this.avatarFile);

                    await axios.put('http://localhost:8080/nhan-vien/update/' + this.nhanVienForm.id, formData, {
                        headers: { 'Content-Type': 'multipart/form-data' }
                    });
                    alert('🎉 Cập nhật thông tin nhân viên thành công!');
                    location.href = '/nhan-vien';
                } catch (e) {
                    alert('Thao tác cập nhật thất bại: ' + (e.response?.data?.message || e.response?.data || e.message));
                }
            }
        }
    }
</script>

<style>
    .customer-form-container { background-color:#f9fbfd;padding:20px; }
    .back-header { margin-bottom:20px;text-align:left; }
    .btn-back-link { background:none;border:none;color:#909399;cursor:pointer;font-size:14px;padding:0; }
    .page-form-title { margin:10px 0 0 0;font-size:18px;color:#303133;font-weight:500; }
    .form-section-card { background:#ffffff;border:1px solid #e4e7ed;border-radius:8px;padding:24px;margin-bottom:24px; }
    .profile-grid { display:flex;gap:40px; }
    .avatar-upload-block { width:200px;display:flex;flex-direction:column;align-items:center;border-right:1px solid #f2f6fc;padding-right:30px; }
    .avatar-preview-circle { width:110px;height:110px;border-radius:50%;background-color:#f5f7fa;display:flex;justify-content:center;align-items:center;overflow:hidden;border:1px solid #e4e7ed;margin-bottom:15px; }
    .avatar-preview-circle img { width:100%;height:100%;object-fit:cover; }
    .default-avatar-icon { font-size:50px;color:#c0c4cc; }
    .btn-upload-avatar { background:#ffffff;border:1px dashed #dcdfe6;padding:6px 16px;border-radius:4px;font-size:13px;cursor:pointer; }
    .upload-hint { color:#909399;font-size:11px;margin-top:8px; }
    .info-fields-block { flex:1; }
    .section-sub-title { font-size:16px;color:#303133;font-weight:600;text-align:left; }
    .form-row { display:flex;gap:20px;margin-bottom:16px; }
    .form-cell { flex:1;display:flex;flex-direction:column;gap:6px;text-align:left; }
    .form-cell label { font-size:13px;color:#606266;font-weight:500; }
    .select-box, .form-cell input { padding:9px 12px;border:1px solid #dcdfe6;border-radius:4px;font-size:13px;outline:none;width:100%;box-sizing:border-box;height:38px; }
    .radio-flex { display:flex;gap:20px;padding:8px 12px;background:#ffffff;height:38px;align-items:center; }
    .radio-flex label { display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px; }
    .border-box { border:1px solid #dcdfe6;border-radius:4px; }
    .address-section-header { display:flex;justify-content:space-between;align-items:center;margin-bottom:20px; }
    .address-item-card { border:1px solid #ebeef5;border-radius:6px;padding:16px;background-color:#fafafa;margin-bottom:16px; }
    .form-submit-bar { display:flex;justify-content:flex-end;gap:12px;margin-top:10px; }
    .btn-cancel-action { background-color:#ffffff;border:1px solid #dcdfe6;color:#606266;padding:10px 24px;border-radius:4px;cursor:pointer;height:38px; }
    .btn-submit-action { background-color:#1a2942;border:none;color:#ffffff;padding:10px 24px;border-radius:4px;cursor:pointer;height:38px; }
    .required { color:#f79b66; }
    .mb-3 { margin-bottom:1rem; }
    .mb-2 { margin-bottom:0.5rem; }
    .fw-bold { font-weight:bold; }
</style>
</body>
</html>
