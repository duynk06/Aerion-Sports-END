<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cập nhật khách hàng</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/alpinejs/3.13.5/cdn.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.6.7/axios.min.js"></script>
</head>
<body>

<!--
  Route gợi ý: GET /khach-hang/sua/{id}  ->  th:action trả về template này.
  ID khách hàng được đọc từ URL (window.location.pathname), nếu bạn dùng
  Controller Thymeleaf có model attribute "id" thì có thể thay bằng:
  th:attr="data-id=${id}" trên thẻ #content để tránh phụ thuộc vào URL.
-->
<div th:replace="~{fragments/layout :: main-layout(~{::#content})}">
    <div id="content" x-data="suaKhachHangPage()" x-init="init()">

        <div class="customer-form-container">
            <div class="back-header">
                <button type="button" class="btn-back-link" onclick="location.href='/khach-hang'">← Quay lại danh sách</button>
                <h3 class="page-form-title">Cập nhật thông tin khách hàng</h3>
            </div>

            <template x-if="loaded">
                <form @submit.prevent="handleSubmitForm()">
                    <div class="form-section-card edit-form-card profile-grid">
                        <div class="avatar-upload-block">
                            <div class="section-sub-title fw-bold mb-3">Ảnh đại diện</div>
                            <div class="avatar-preview-circle mb-3">
                                <img x-show="customerForm.avatar" :src="customerForm.avatar" alt="Avatar" />
                                <span x-show="!customerForm.avatar" class="default-avatar-icon">👤</span>
                            </div>
                            <button type="button" class="btn-upload-avatar mb-2" @click="$refs.formFileInput.click()">📁 Chọn ảnh</button>
                            <input type="file" x-ref="formFileInput" style="display:none;" accept="image/jpeg,image/png,image/jpg" @change="handleFormAvatarChange($event)" />
                            <small class="upload-hint">JPG, PNG (tối đa 2MB)</small>
                        </div>

                        <div class="info-fields-block">
                            <div class="section-sub-title fw-bold mb-3">Thông tin khách hàng</div>
                            <div class="form-row">
                                <div class="form-cell" :class="{ 'has-error': errors.hoTen }">
                                    <label>Họ và tên <span class="required">*</span></label>
                                    <input type="text" x-model="customerForm.hoTen" placeholder="Nhập họ và tên" @input="errors.hoTen = ''" @blur="validateHoTen()" required />
                                    <span x-show="errors.hoTen" class="error-text" x-text="errors.hoTen"></span>
                                </div>
                                <div class="form-cell" :class="{ 'has-error': errors.sdt }">
                                    <label>Số điện thoại <span class="required">*</span></label>
                                    <input type="text" x-model="customerForm.sdt" placeholder="Nhập số điện thoại" @input="errors.sdt = ''" @blur="validateSdt()" required />
                                    <span x-show="errors.sdt" class="error-text" x-text="errors.sdt"></span>
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-cell" :class="{ 'has-error': errors.email }">
                                    <label>Email <span class="required">*</span></label>
                                    <input type="email" x-model="customerForm.email" placeholder="Nhập email" @input="errors.email = ''" @blur="validateEmail()" required />
                                    <span x-show="errors.email" class="error-text" x-text="errors.email"></span>
                                </div>
                                <div class="form-cell" :class="{ 'has-error': errors.ngaySinh }">
                                    <label>Ngày sinh <span class="required">*</span></label>
                                    <input type="date" x-model="customerForm.ngaySinh" :max="ngayMaxChoPhep" @change="validateNgaySinh()" required />
                                    <span x-show="errors.ngaySinh" class="error-text" x-text="errors.ngaySinh"></span>
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-cell">
                                    <label>Giới tính</label>
                                    <div class="radio-flex border-box">
                                        <label><input type="radio" x-model="customerForm.gioiTinh" value="1" /> Nam</label>
                                        <label><input type="radio" x-model="customerForm.gioiTinh" value="0" /> Nữ</label>
                                    </div>
                                </div>
                                <div class="form-cell">
                                    <label>Trạng thái</label>
                                    <select x-model.number="customerForm.trangThai" class="select-box">
                                        <option :value="1">Hoạt động</option>
                                        <option :value="0">Ngừng hoạt động</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="form-section-card address-list-section">
                        <div class="address-section-header">
                            <div class="section-sub-title fw-bold">Danh sách địa chỉ nhận hàng</div>
                            <button type="button" class="btn-add-address-item" @click="addNewAddressRow()">+ Thêm địa chỉ mới</button>
                        </div>

                        <template x-for="(addr, idx) in customerForm.addresses" :key="addr.uid">
                            <div class="address-item-card">
                                <div class="address-item-title">
                                    <span>Khối địa chỉ <span x-text="idx + 1"></span></span>
                                    <button x-show="customerForm.addresses.length > 1" type="button" class="btn-delete-address" @click="removeAddressRow(idx)">Xóa dòng này</button>
                                </div>

                                <div class="form-row">
                                    <div class="form-cell">
                                        <label>Tỉnh / Thành phố <span class="required">*</span></label>
                                        <select x-model="addr.tinhThanh" class="select-box" @change="handleThayDoiTinhThanh(addr)" required>
                                            <option value="">-- Chọn Tỉnh / Thành phố --</option>
                                            <template x-for="tinh in listTinhThanhAPI" :key="tinh.code">
                                                <option :value="tinh.name" x-text="tinh.name"></option>
                                            </template>
                                        </select>
                                    </div>
                                    <div class="form-cell">
                                        <label>Quận / Huyện <span class="required">*</span></label>
                                        <select x-model="addr.quanHuyen" class="select-box" :disabled="!addr.tinhThanh" @change="handleThayDoiQuanHuyen(addr)" required>
                                            <option value="">-- Chọn Quận / Huyện --</option>
                                            <template x-for="quan in addr.listQuanHuyenTmp" :key="quan.code">
                                                <option :value="quan.name" x-text="quan.name"></option>
                                            </template>
                                        </select>
                                    </div>
                                </div>

                                <div class="form-row">
                                    <div class="form-cell">
                                        <label>Phường / Xã / Thị trấn <span class="required">*</span></label>
                                        <select x-model="addr.phuongXa" class="select-box" :disabled="!addr.quanHuyen" required>
                                            <option value="">-- Chọn Phường / Xã --</option>
                                            <template x-for="xa in addr.listPhuongXaTmp" :key="xa.code">
                                                <option :value="xa.name" x-text="xa.name"></option>
                                            </template>
                                        </select>
                                    </div>
                                    <div class="form-cell">
                                        <label>Tên người nhận <span class="required">*</span></label>
                                        <input type="text" x-model="addr.nguoiNhan" placeholder="Nhập tên người nhận" required />
                                    </div>
                                </div>

                                <div class="form-row">
                                    <div class="form-cell">
                                        <label>SĐT người nhận <span class="required">*</span></label>
                                        <input type="text" x-model="addr.sdt" placeholder="Nhập số điện thoại nhận" required />
                                    </div>
                                    <div class="form-cell">
                                        <label>Địa chỉ chi tiết <span class="required">*</span></label>
                                        <input type="text" x-model="addr.diaChiChiTiet" placeholder="Nhập số nhà, tên đường..." required />
                                    </div>
                                </div>

                                <div class="checkbox-default-wrapper">
                                    <label class="toggle-control">
                                        <input type="checkbox" :checked="addr.macDinh" @change="setFormDefaultAddress(idx)" />
                                        <span class="control-label">Đặt làm địa chỉ mặc định</span>
                                    </label>
                                </div>
                            </div>
                        </template>
                    </div>

                    <div class="form-submit-bar">
                        <button type="button" class="btn-cancel-action" onclick="location.href='/khach-hang'">Hủy bỏ</button>
                        <button type="submit" class="btn-submit-action">Lưu thông tin cập nhật</button>
                    </div>
                </form>
            </template>

            <div x-show="!loaded" style="padding:40px;text-align:center;color:#909399;">Đang tải dữ liệu khách hàng...</div>
        </div>

    </div>
</div>

<script>
    function suaKhachHangPage() {
        return {
            customerId: null,
            loaded: false,
            listTinhThanhAPI: [],

            customerForm: { id: null, hoTen: '', sdt: '', email: '', ngaySinh: '', gioiTinh: '1', trangThai: 1, avatar: '', addresses: [] },
            errors: { hoTen: '', sdt: '', email: '', ngaySinh: '' },

            get ngayMaxChoPhep() {
                const today = new Date();
                const y = today.getFullYear() - 15;
                const m = String(today.getMonth() + 1).padStart(2, '0');
                const d = String(today.getDate()).padStart(2, '0');
                return `${y}-${m}-${d}`;
            },

            async init() {
                // Lấy id khách hàng từ URL dạng /khach-hang/sua/{id}
                const parts = window.location.pathname.split('/').filter(Boolean);
                this.customerId = parts[parts.length - 1];
                await this.load63TinhThanh();
                await this.loadDuLieuKhachHangCu();
            },

            async load63TinhThanh() {
                try {
                    const res = await axios.get('https://provinces.open-api.vn/api/p/');
                    this.listTinhThanhAPI = res.data || [];
                } catch (e) { console.error('Lỗi tải 63 tỉnh thành: ', e); }
            },

            async loadDuLieuKhachHangCu() {
                try {
                    const res = await axios.get('http://localhost:8080/public/khach-hang/' + this.customerId);
                    const kh = res.data;
                    if (!kh) { this.loaded = true; return; }

                    let processedAddresses = [];
                    if (Array.isArray(kh.addresses) && kh.addresses.length > 0) {
                        processedAddresses = await Promise.all(kh.addresses.map(async (addr) => {
                            let pXa = addr.phuongXa || '';
                            let qHuyen = '';
                            if (pXa.includes(', ')) {
                                const parts = pXa.split(', ');
                                pXa = parts[0]?.trim() || '';
                                qHuyen = parts[1]?.trim() || '';
                            }
                            let huyenList = [], xaList = [];
                            if (addr.tinhThanh && this.listTinhThanhAPI.length > 0) {
                                const tinh = this.listTinhThanhAPI.find(t => t.name.trim() === addr.tinhThanh.trim());
                                if (tinh) {
                                    const resHuyen = await axios.get(`https://provinces.open-api.vn/api/p/${tinh.code}?depth=2`);
                                    huyenList = resHuyen.data.districts || [];
                                    if (qHuyen && huyenList.length > 0) {
                                        const quan = huyenList.find(q => q.name.trim() === qHuyen.trim());
                                        if (quan) {
                                            const resXa = await axios.get(`https://provinces.open-api.vn/api/d/${quan.code}?depth=2`);
                                            xaList = resXa.data.wards || [];
                                        }
                                    }
                                }
                            }
                            return {
                                uid: 'existing-' + (addr.id ?? Math.random()),
                                id: addr.id ?? null,
                                tinhThanh: addr.tinhThanh || '', quanHuyen: qHuyen, phuongXa: pXa,
                                diaChiChiTiet: addr.diaChiChiTiet || '', nguoiNhan: addr.nguoiNhan || '', sdt: addr.sdt || '',
                                macDinh: addr.macDinh === true || addr.macDinh === 1,
                                listQuanHuyenTmp: huyenList, listPhuongXaTmp: xaList
                            };
                        }));
                    } else {
                        processedAddresses = [{ uid: 'new-' + Date.now(), id: null, tinhThanh: '', quanHuyen: '', phuongXa: '', diaChiChiTiet: '', nguoiNhan: '', sdt: '', macDinh: true, listQuanHuyenTmp: [], listPhuongXaTmp: [] }];
                    }

                    this.customerForm = {
                        id: kh.id, hoTen: kh.hoTen || '', sdt: kh.sdt || '', email: kh.email || '', ngaySinh: kh.ngaySinh || '',
                        gioiTinh: String(kh.gioiTinh), trangThai: (kh.trangThai === true || Number(kh.trangThai) === 1) ? 1 : 0,
                        avatar: kh.avatar || '', addresses: processedAddresses
                    };
                    this.loaded = true;
                } catch (e) {
                    console.error('Lỗi nạp hồ sơ khách hàng cũ: ', e);
                    this.loaded = true;
                }
            },

            async handleThayDoiTinhThanh(addr) {
                addr.quanHuyen = ''; addr.phuongXa = ''; addr.listQuanHuyenTmp = []; addr.listPhuongXaTmp = [];
                if (!addr.tinhThanh) return;
                const tinh = this.listTinhThanhAPI.find(t => t.name === addr.tinhThanh);
                if (tinh) {
                    const res = await axios.get(`https://provinces.open-api.vn/api/p/${tinh.code}?depth=2`);
                    addr.listQuanHuyenTmp = res.data.districts || [];
                }
            },
            async handleThayDoiQuanHuyen(addr) {
                addr.phuongXa = ''; addr.listPhuongXaTmp = [];
                if (!addr.quanHuyen) return;
                const quan = addr.listQuanHuyenTmp.find(q => q.name === addr.quanHuyen);
                if (quan) {
                    const res = await axios.get(`https://provinces.open-api.vn/api/d/${quan.code}?depth=2`);
                    addr.listPhuongXaTmp = res.data.wards || [];
                }
            },

            addNewAddressRow() {
                this.customerForm.addresses.push({ uid: 'new-' + Date.now(), id: null, tinhThanh: '', quanHuyen: '', phuongXa: '', diaChiChiTiet: '', nguoiNhan: '', sdt: '', macDinh: this.customerForm.addresses.length === 0, listQuanHuyenTmp: [], listPhuongXaTmp: [] });
            },
            setFormDefaultAddress(index) { this.customerForm.addresses.forEach((a, idx) => a.macDinh = idx === index); },
            removeAddressRow(index) {
                const wasDef = this.customerForm.addresses[index].macDinh;
                this.customerForm.addresses.splice(index, 1);
                if (wasDef && this.customerForm.addresses.length > 0) this.customerForm.addresses[0].macDinh = true;
            },

            avatarFile: null,

            handleFormAvatarChange(e) {
                const f = e.target.files[0]; if (!f) return;
                if (f.size > 2 * 1024 * 1024) return alert('Dung lượng ảnh tối đa 2MB!');
                this.avatarFile = f;
                const r = new FileReader();
                r.onload = (ev) => this.customerForm.avatar = ev.target.result; // chỉ để preview
                r.readAsDataURL(f);
            },

            validateSdt() {
                if (!/^(0[3|5|7|8|9])([0-9]{8})$/.test(this.customerForm.sdt.trim())) { this.errors.sdt = 'SĐT không đúng định dạng nhà mạng VN!'; return false; }
                this.errors.sdt = ''; return true;
            },
            validateEmail() {
                if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(this.customerForm.email.trim())) { this.errors.email = 'Email sai định dạng!'; return false; }
                this.errors.email = ''; return true;
            },
            validateNgaySinh() {
                if (!this.customerForm.ngaySinh) { this.errors.ngaySinh = 'Vui lòng chọn ngày sinh!'; return false; }
                const birthDate = new Date(this.customerForm.ngaySinh); const today = new Date();
                let age = today.getFullYear() - birthDate.getFullYear();
                const m = today.getMonth() - birthDate.getMonth();
                if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) age--;
                if (age < 15) { this.errors.ngaySinh = `Khách hàng chưa đủ điều kiện (Yêu cầu phải từ 15 tuổi trở lên, hiện tại: ${age} tuổi)!`; return false; }
                this.errors.ngaySinh = ''; return true;
            },
            validateHoTen() {
                let name = this.customerForm.hoTen.trim();
                if (!name) { this.errors.hoTen = 'Họ tên khách hàng không được để trống!'; return false; }
                name = name.replace(/\s+/g, ' ');
                this.customerForm.hoTen = name;
                if (name.length < 3 || name.length > 100) { this.errors.hoTen = `Độ dài họ tên phải từ 3 đến 100 ký tự (Hiện tại: ${name.length} ký tự)!`; return false; }
                if (!/^[\p{L}\s]+$/u.test(name)) { this.errors.hoTen = 'Họ tên không được chứa số hoặc ký tự đặc biệt!'; return false; }
                this.errors.hoTen = ''; return true;
            },

            async handleSubmitForm() {
                const hoTenHopLe = this.validateHoTen();
                const sdtHopLe = this.validateSdt();
                const emailHopLe = this.validateEmail();
                const tuoiHopLe = this.validateNgaySinh();
                if (!hoTenHopLe || !sdtHopLe || !emailHopLe || !tuoiHopLe) return alert('Vui lòng hoàn thiện đúng các trường hiển thị lỗi đỏ!');

                const trong = this.customerForm.addresses.some(a => !a.nguoiNhan.trim() || !a.sdt.trim() || !a.tinhThanh || !a.quanHuyen || !a.phuongXa || !a.diaChiChiTiet.trim());
                if (trong) return alert('Vui lòng không để trống bất kì thông tin nào trong khối sổ địa chỉ!');

                try {
                    const checkTrungRes = await axios.get('http://localhost:8080/public/khach-hang/check-trung', {
                        params: { sdt: this.customerForm.sdt.trim(), email: this.customerForm.email.trim(), excludeId: this.customerForm.id }
                    });
                    const { trungSdt, trungEmail } = checkTrungRes.data;
                    if (trungSdt) { this.errors.sdt = 'Số điện thoại này đã tồn tại trên hệ thống!'; return alert('Thất bại: Số điện thoại này đã được đăng ký bởi khách hàng khác!'); }
                    if (trungEmail) { this.errors.email = 'Địa chỉ Email này đã tồn tại trên hệ thống!'; return alert('Thất bại: Địa chỉ email này đã được sử dụng bởi khách hàng khác!'); }

                    const processed = this.customerForm.addresses.map(addr => ({
                        id: addr.id || null,
                        nguoiNhan: addr.nguoiNhan.trim(), sdt: addr.sdt.trim(), tinhThanh: addr.tinhThanh,
                        phuongXa: `${addr.phuongXa}, ${addr.quanHuyen}`, diaChiChiTiet: addr.diaChiChiTiet.trim(),
                        macDinh: addr.macDinh ? 1 : 0
                    }));

                    // 🌟 Không gửi avatar base64 trong JSON nữa. Nếu người dùng không đổi ảnh
                    // thì để trống -> service sẽ giữ nguyên avatar cũ trong DB (vì service chỉ
                    // set avatar khi field != null).
                    const payload = {
                        hoTen: this.customerForm.hoTen.trim(), sdt: this.customerForm.sdt.trim(), email: this.customerForm.email || null,
                        ngaySinh: this.customerForm.ngaySinh || null, gioiTinh: Number(this.customerForm.gioiTinh),
                        trangThai: Number(this.customerForm.trangThai),
                        addresses: processed
                    };

                    // 🌟 Gửi multipart để khớp với endpoint updateMultipart trong Controller,
                    // giống hệt cơ chế trang Thêm khách hàng
                    const formData = new FormData();
                    formData.append('data', JSON.stringify(payload));
                    if (this.avatarFile) formData.append('avatar', this.avatarFile);

                    await axios.put('http://localhost:8080/public/khach-hang/update/' + this.customerForm.id, formData, {
                        headers: { 'Content-Type': 'multipart/form-data' }
                    });
                    alert('🎉 Cập nhật thông tin khách hàng thành công!');
                    location.href = '/khach-hang';
                } catch (e) {
                    alert('Thao tác cập nhật thất bại: ' + (e.response?.data?.message || e.response?.data || e.message));
                }
            }
        }
    }
</script>

<style>
    .form-cell.has-error input { border-color:#ef4444 !important; background-color:#fef2f2; }
    .error-text { color:#ef4444;font-size:12px;margin-top:4px;display:block;text-align:left; }
    .customer-form-container { background-color:#f9fbfd;padding:20px; }
    .back-header { margin-bottom:20px;text-align:left; }
    .btn-back-link { background:none;border:none;color:#909399;cursor:pointer;font-size:14px;padding:0; }
    .page-form-title { margin:10px 0 0 0;font-size:18px;color:#303133;font-weight:500; }
    .form-section-card { background:#ffffff;border:1px solid #e4e7ed;border-radius:8px;padding:24px;margin-bottom:24px; }
    .profile-grid { display:flex;gap:40px; }
    .avatar-upload-block { width:200px;display:flex;flex-direction:column;align-items:center;border-right:1px solid #f2f6fc;padding-right:30px; }
    .avatar-preview-circle { width:110px;height:110px;border-radius:50%;background-color:#f5f7fa;display:flex;justify-content:center;align-items:center;overflow:hidden;border:1px solid #e4e7ed;margin-bottom:15px; }
    .avatar-preview-circle img { width:100%;height:100%;object-fit:cover; }
    .default-avatar-icon { font-size:50px;color:#c0c4cc; }
    .btn-upload-avatar { background:#ffffff;border:1px dashed #dcdfe6;padding:6px 16px;border-radius:4px;font-size:13px;cursor:pointer; }
    .upload-hint { color:#909399;font-size:11px;margin-top:8px; }
    .info-fields-block { flex:1; }
    .section-sub-title { font-size:16px;color:#303133;font-weight:600;text-align:left; }
    .form-row { display:flex;gap:20px;margin-bottom:16px; }
    .form-cell { flex:1;display:flex;flex-direction:column;gap:6px;text-align:left; }
    .form-cell label, .address-item-title label { font-size:13px;color:#606266;font-weight:500; }
    .select-box, .form-cell input { padding:9px 12px;border:1px solid #dcdfe6;border-radius:4px;font-size:13px;outline:none;width:100%;box-sizing:border-box;height:38px; }
    .radio-flex { display:flex;gap:20px;padding:8px 12px;background:#ffffff;height:38px;align-items:center; }
    .radio-flex label { display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px; }
